<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, 'PingFang TC', 'Segoe UI', sans-serif">
  <!-- bg -->
  <rect width="960" height="540" fill="#fdfdfb"/>
  <rect width="960" height="64" fill="#0f766e"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Every lesson ships four recall weapons</text>

  <!-- 1. Reveal card -->
  <g>
    <rect x="30" y="96" width="435" height="150" rx="12" fill="#ffffff" stroke="#d6d3cd"/>
    <text x="52" y="128" font-size="15" font-weight="600" fill="#1a1a2e">Q · What does a KV cache store?</text>
    <text x="52" y="150" font-size="12" fill="#6b7280">answer it in your head first…</text>
    <line x1="52" y1="166" x2="443" y2="166" stroke="#d6d3cd" stroke-dasharray="4 4"/>
    <text x="52" y="192" font-size="13" fill="#1a1a2e">The intermediate computation for every</text>
    <text x="52" y="212" font-size="13" fill="#1a1a2e">token read so far — not the output text.</text>
    <path d="M430 218 l10 24 4-10 10-3 z" fill="#1a1a2e"/>
    <text x="30" y="272" font-size="13" font-weight="700" fill="#0f766e">① Reveal cards — recall before you peek</text>
  </g>

  <!-- 2. Quiz -->
  <g>
    <rect x="495" y="96" width="435" height="150" rx="12" fill="#ffffff" stroke="#d6d3cd"/>
    <text x="517" y="126" font-size="14" font-weight="600" fill="#1a1a2e">What decides whether cached work is reused?</text>
    <rect x="517" y="140" width="391" height="26" rx="6" fill="#f0fdf4" stroke="#15803d"/>
    <text x="529" y="158" font-size="12" fill="#15803d">✓ byte-exact shared prefix match</text>
    <rect x="517" y="172" width="391" height="26" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="529" y="190" font-size="12" fill="#b91c1c">semantic similarity to the nearest cache</text>
    <rect x="517" y="206" width="391" height="30" rx="6" fill="#f4f3ef"/>
    <text x="529" y="222" font-size="11" fill="#1a1a2e">goal → error pattern → one next step</text>
    <text x="495" y="272" font-size="13" font-weight="700" fill="#0f766e">② Quiz — instant verdict, feedback triad</text>
  </g>

  <!-- 3. Key-term mapping -->
  <g>
    <rect x="30" y="300" width="435" height="164" rx="12" fill="#ffffff" stroke="#d6d3cd"/>
    <rect x="52" y="322" width="391" height="56" rx="6" fill="#f4f3ef"/>
    <text x="64" y="344" font-size="11.5" font-family="Menlo, monospace" fill="#1a1a2e">slot's KV cache held <tspan fill="#ca8a04" font-weight="700">172,573 tokens</tspan>; retry</text>
    <text x="64" y="364" font-size="11.5" font-family="Menlo, monospace" fill="#1a1a2e"><tspan fill="#ca8a04" font-weight="700">rewrites the message</tspan> → shared prefix misaligned</text>
    <text x="52" y="404" font-size="12.5" fill="#1a1a2e"><tspan font-weight="700">172,573 tokens：</tspan>a huge prefill asset —</text>
    <text x="52" y="422" font-size="12.5" fill="#1a1a2e">destroying it costs minutes of recompute.</text>
    <text x="30" y="488" font-size="13" font-weight="700" fill="#0f766e">③ Key-term mapping — click the real log, learn the role</text>
  </g>

  <!-- 4. Consolidate -->
  <g>
    <rect x="495" y="300" width="435" height="164" rx="12" fill="#ffffff" stroke="#d6d3cd"/>
    <text x="517" y="330" font-size="14" font-weight="600" fill="#1a1a2e">Without looking up: the core, one sentence.</text>
    <rect x="517" y="346" width="290" height="32" rx="8" fill="#ffffff" stroke="#d6d3cd"/>
    <text x="529" y="367" font-size="12" fill="#6b7280">one sentence…</text>
    <rect x="817" y="346" width="91" height="32" rx="8" fill="#0f766e"/>
    <text x="862" y="367" text-anchor="middle" font-size="12" fill="#ffffff">check</text>
    <rect x="517" y="394" width="391" height="30" rx="6" fill="#f0fdf4"/>
    <text x="529" y="414" font-size="12" fill="#15803d">✓ hits the core — compare with the reference line</text>
    <text x="495" y="488" font-size="13" font-weight="700" fill="#0f766e">④ Consolidation — write it, get judged, close the gap</text>
  </g>
</svg>
